name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Pinned to a SHA: @v2 is mutable, and this action runs with
      # contents: write plus an explicit GITHUB_TOKEN. v2 as of 2026-07-25.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@6269b9a08af89020bb86cde31485d18c7d41ac33
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=true&count_private=true&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@6269b9a08af89020bb86cde31485d18c7d41ac33
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark&hide_border=true&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # main requires the CodeRabbit status check, so a bot push there is
      # rejected (GH006). Same pattern as snake.yml: publish to a branch.
      - name: Push cards to the cards branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: cards
          build_dir: profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
