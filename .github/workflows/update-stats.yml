name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Fetched with curl rather than github-readme-stats-action: that action
      # silently ignores theme/hide_border, so the cards came out default-themed
      # with a border. Hitting the endpoint directly keeps styling identical to
      # what the README used to request inline.
      - name: Fetch cards
        env:
          BASE: https://github-stats-extended.vercel.app
          USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p profile
          fetch() {
            local url="$1" out="$2" tmp
            tmp="$(mktemp)"
            curl -sS --fail --location --retry 3 --retry-delay 5 \
                 --max-time 30 "$url" -o "$tmp"
            # A truncated or error response would otherwise be committed as a
            # broken card, so require a real SVG of plausible size.
            if ! head -c 512 "$tmp" | grep -q '<svg'; then
              echo "::error::$out is not SVG"; exit 1
            fi
            if [ "$(wc -c <"$tmp")" -lt 1000 ]; then
              echo "::error::$out suspiciously small ($(wc -c <"$tmp") bytes)"; exit 1
            fi
            mv "$tmp" "$out"
            echo "$out: $(wc -c <"$out") bytes"
          }
          fetch "$BASE/api?username=$USER&theme=dark&hide_border=true&count_private=true&show_icons=true" profile/stats.svg
          fetch "$BASE/api/top-langs/?username=$USER&theme=dark&hide_border=true&layout=compact&langs_count=8" profile/top-langs.svg

      # main requires the CodeRabbit status check, so a bot push there is
      # rejected (GH006). Same pattern as snake.yml: publish to a branch.
      - name: Push cards to the cards branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: cards
          build_dir: profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
