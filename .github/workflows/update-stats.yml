name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Fetched with curl rather than github-readme-stats-action: that action
      # silently ignores theme/hide_border, so the cards came out default-themed
      # with a border. Hitting the endpoint directly keeps styling identical to
      # what the README used to request inline.
      - name: Fetch cards
        env:
          # Self-hosted instance on the homelab. The public instance
          # authenticates with a public-only token, so private repos were
          # invisible and the language shares read wrong.
          BASE: https://stats.lucassantana.tech
          USER: ${{ github.repository_owner }}
          # Caddy refuses requests without this. The instance is reachable from
          # the internet and the app has no auth of its own.
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p profile
          fetch() {
            local url="$1" out="$2" tmp
            tmp="$(mktemp)"
            curl -sS --fail --location --retry 3 --retry-delay 5 \
                 --max-time 30 -H "X-Stats-Key: $STATS_KEY" "$url" -o "$tmp"
            # A truncated or error response would otherwise be committed as a
            # broken card, so require a real SVG of plausible size.
            if ! head -c 512 "$tmp" | grep -q '<svg'; then
              echo "::error::$out is not SVG"; exit 1
            fi
            if [ "$(wc -c <"$tmp")" -lt 1000 ]; then
              echo "::error::$out suspiciously small ($(wc -c <"$tmp") bytes)"; exit 1
            fi
            mv "$tmp" "$out"
            echo "$out: $(wc -c <"$out") bytes"
          }
          fetch "$BASE/api?username=$USER&theme=dark&hide_border=true&count_private=true&show_icons=true" profile/stats.svg
          # No trailing slash on /api/top-langs: the app routes with an exact
          # path match, so /api/top-langs/ is a 404. The public Vercel instance
          # normalised that for us; the self-hosted Express app does not.
          # hide= drops markup/template/styling file types that inflate the card
          # without saying anything about what I actually build. Seven slots
          # to fit the current language mix once private repos are counted.
          fetch "$BASE/api/top-langs?username=$USER&theme=dark&hide_border=true&layout=compact&langs_count=7&hide=html,css,scss,less,astro,vue,svelte,handlebars,ejs,mdx" profile/top-langs.svg

      # main requires the CodeRabbit status check, so a bot push there is
      # rejected (GH006). Same pattern as snake.yml: publish to a branch.
      - name: Push cards to the cards branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: cards
          build_dir: profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
